<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Scheda di Allenamento</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🏋️ Scheda di Allenamento</h1>
  </header>

  <main>
    <section id="view-scheda" class="view"></section>
    <section id="view-timer" class="view" hidden></section>
    <section id="view-edit" class="view" hidden></section>
  </main>

  <nav class="bottom-nav">
    <button id="nav-scheda" class="nav-btn">
      <span class="nav-icon">📋</span><span>Scheda</span>
    </button>
    <button id="nav-timer" class="nav-btn">
      <span class="nav-icon">⏱️</span><span>Timer</span>
    </button>
    <button id="nav-edit" class="nav-btn">
      <span class="nav-icon">✏️</span><span>Modifica</span>
    </button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
